<!DOCTYPE html>
<html>
	<head>
		<title>Визитка: Латкин К. П.</title>
		<link href="https://fonts.googleapis.com/css2?family=PT+Sans" rel="stylesheet">
		<link rel="shortcut icon" href="./images/favicon.ico">
		<link rel="stylesheet" href="./style.css">
		<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
	</head>
	
	<body>
		<!-- Основное содержимое страницы -->
		<div class="langtabs">
		<input type="radio" id="ru" name="langtabs" checked>
		<label for="ru">RU</label>
		<input type="radio" id="en" name="langtabs">
		<label for="en">EN</label>
			<div class="maintabs">
			
				<!-- Вкладка CARD -->
				<input type="radio" id="cardtab" name="maintabs" checked>
				<label for="cardtab"><span class="entxt">BUSINESS CARD</span><span class="rutxt">ВИЗИТКА</span></label>
				<div class="tab">
					<p><span class="entxt">Business card text</span><span class="rutxt">Текст визитки</span></p>
				</div>
				
				<!-- Вкладка SCIENCE -->
				<input type="radio" id="sctab" name="maintabs">
				<label for="sctab"><span class="entxt">SCIENCE</span><span class="rutxt">НАУКА</span></label>
				<div class="tab">
					<p><span class="entxt">Science text</span><span class="rutxt">Текст науки</span></p>
				</div>
				
				<!-- Вкладка CV -->
				<input type="radio" id="cvtab" name="maintabs">
				<label for="cvtab"><span class="entxt">CV</span><span class="rutxt">РЕЗЮМЕ</span></label>
				<div class="tab">
					<p><span class="entxt">CV text</span><span class="rutxt">Текст резюме</span></p>
		   	</div>
		   	
		   	<!-- Вкладка MEDIA -->
				<input type="radio" id="mediatab" name="maintabs">
				<label for="mediatab"><span class="entxt">MEDIA</span><span class="rutxt">СМИ</span></label>
				<div class="tab">
					<p><span class="entxt">Business media</span><span class="rutxt">Текст СМИ</span></p>
				</div>
			</div>
		</div>

		<!-- Футер -->
		<footer>
			<p>2025-<span id="year"></span><a target="_blank" href="https://github.com/latkinkp/"><img src="./images/logo.png" width="65" height="65" align="middle"></img></a>K.&nbspP.&nbspLatkin</p>
		</footer>

		<!-- Кнопка ВВЕРХ -->
		<a href="#top" class="homeButton"><img src="./images/home.png" width="35px" height=35px"></img></a>
		
		<!-- Скрипт -->
		<script src="./main.js" defer></script>
	</body>
</html>
